<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | AI-ecommerce</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="form-container">
    <h2>Register</h2>
    <form id="registerForm" autocomplete="off">
      <label>Username</label>
      <input type="text" id="regUsername" required>
      <small id="userError"></small>

      <label>Email</label>
      <input type="email" id="regEmail" required>
      <small id="emailError"></small>

      <label>Password</label>
      <input type="password" id="regPassword" required>
      <div id="strengthBar"></div>
      <small id="pwError"></small>

      <label>Confirm Password</label>
      <input type="password" id="regConfirm" required>
      <small id="confirmError"></small>

      <label>
        <input type="checkbox" id="terms" required> I agree to the terms
      </label>
      <button type="submit">Register</button>
      <p>Already have an account? <a href="login.html">Login</a></p>
      <div id="registerSuccess"></div>
    </form>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
