<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – ShopAI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 60px auto;
      padding: 40px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .auth-container h1 {
      margin-bottom: 8px;
      text-align: center;
      color: var(--text-dark);
    }

    .auth-container p {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 32px;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-dark);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .error-message {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 4px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .auth-button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .auth-button:hover {
      background: #2563eb;
    }

    .auth-button:disabled {
      background: var(--text-light);
      cursor: not-allowed;
    }

    .auth-link {
      text-align: center;
      margin-top: 20px;
    }

    .auth-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    /* Success & Error Messages */
    .message-box {
      padding: 14px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
      animation: slideDown 0.3s ease;
    }

    .message-box.show {
      display: block;
    }

    .message-box.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message-box.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Password Strength Meter */
    .strength-meter {
      margin-top: 8px;
      height: 5px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s, background-color 0.3s;
    }

    .strength-text {
      font-size: 0.75rem;
      margin-top: 4px;
      color: #666;
    }

    .terms-checkbox {
      display: flex;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .terms-checkbox input {
      margin-right: 8px;
      margin-top: 4px;
      cursor: pointer;
      width: auto;
    }

    .terms-checkbox label {
      margin: 0;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .terms-checkbox label a {
      color: var(--primary);
      text-decoration: none;
    }

    .terms-checkbox label a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header id="main-header"></header>

  <div class="auth-container">
    <h1><i class="fas fa-user-plus"></i> Register</h1>
    <p>Create a new account</p>

    <div class="message-box" id="message-box"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="regUsername">Username</label>
        <input type="text" id="regUsername" name="regUsername" required>
        <div class="error-message" id="userError"></div>
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" name="regEmail" required>
        <div class="error-message" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="regPassword" required>
        <div class="strength-meter">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-text" id="strengthText">Password strength: Weak</div>
        <div class="error-message" id="pwError"></div>
      </div>

      <div class="form-group">
        <label for="regConfirm">Confirm Password</label>
        <input type="password" id="regConfirm" name="regConfirm" required>
        <div class="error-message" id="confirmError"></div>
      </div>

      <div class="terms-checkbox">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a></label>
        <div class="error-message" id="termsError"></div>
      </div>

      <button type="submit" class="auth-button" id="register-btn">Register</button>
    </form>

    <div class="auth-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a href="index.html" class="logo"><i class="fas fa-robot"></i> ShopAI</a>
          <p>AI-powered shopping for smarter discoveries.</p>
        </div>
      </div>
      <div class="footer-bottom">
        <span>&copy; 2024 ShopAI. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
