<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – ShopAI</title>
  <meta name="description" content="Create a free ShopAI account for AI-powered product recommendations.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="rsponsive.css">
  <style>
    .auth-page {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-mid) 60%, #16213e 100%);
    }
    .auth-card {
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      padding: 44px 40px;
      animation: slideUp 0.35s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 28px;
      text-decoration: none;
    }
    .auth-logo i { color: var(--accent); }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark);
      text-align: center;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper .form-input {
      padding-right: 44px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
    }
    .toggle-password:hover { color: var(--primary); }
    .form-input-icon-wrap {
      position: relative;
    }
    .form-input-icon-wrap .form-input {
      padding-left: 40px;
    }
    .form-input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 0.95rem;
      pointer-events: none;
    }
    /* Password field has both icon on left and toggle on right */
    .pw-field-wrap {
      position: relative;
    }
    .pw-field-wrap .form-input {
      padding-left: 40px;
      padding-right: 44px;
    }
    .pw-field-wrap .form-input-icon {
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      position: absolute;
      color: var(--text-light);
      font-size: 0.95rem;
      pointer-events: none;
    }
    /* Password strength bar */
    .strength-bar-container {
      margin-top: 8px;
    }
    .strength-bar-track {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .strength-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.3s ease, background 0.3s ease;
    }
    .strength-label {
      font-size: 0.78rem;
      font-weight: 600;
    }
    .strength-weak   { color: var(--error); }
    .strength-fair   { color: var(--warning); }
    .strength-good   { color: var(--info); }
    .strength-strong { color: var(--success); }
    .strength-bar-fill.strength-weak   { background: var(--error);   width: 25%; }
    .strength-bar-fill.strength-fair   { background: var(--warning); width: 50%; }
    .strength-bar-fill.strength-good   { background: var(--info);    width: 75%; }
    .strength-bar-fill.strength-strong { background: var(--success); width: 100%; }
    /* Strength hints */
    .strength-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .strength-hint {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-light);
      transition: color var(--transition);
    }
    .strength-hint.met { color: var(--success); }
    .strength-hint i { font-size: 0.7rem; }
    /* Checkbox */
    .form-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .form-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .form-check a {
      color: var(--primary);
      font-weight: 500;
    }
    .form-check a:hover { text-decoration: underline; }
    .btn-submit {
      width: 100%;
      justify-content: center;
      padding: 13px 24px;
      font-size: 1rem;
      margin-top: 20px;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: var(--text-light);
      font-size: 0.82rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .auth-switch {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-switch a {
      color: var(--primary);
      font-weight: 600;
    }
    .auth-switch a:hover { text-decoration: underline; }
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
      align-items: flex-start;
      gap: 10px;
    }
    .alert.show { display: flex; }
    .alert-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #b91c1c;
    }
    .alert-success {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      color: #065f46;
    }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 20px; }
      .auth-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header id="main-header"></header>

  <main class="auth-page">
    <div class="auth-card">

      <a href="index.html" class="auth-logo">
        <i class="fas fa-robot"></i> ShopAI
      </a>

      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Join ShopAI for AI-powered shopping recommendations</p>

      <div class="alert alert-error" id="register-alert" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        <span id="register-alert-msg">Please fix the errors below.</span>
      </div>

      <form id="register-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="reg-name">Full name <span class="required">*</span></label>
          <div class="form-input-icon-wrap">
            <i class="fas fa-user form-input-icon"></i>
            <input
              type="text"
              id="reg-name"
              name="fullName"
              class="form-input"
              placeholder="Jane Smith"
              autocomplete="name"
              required
            >
          </div>
          <span class="form-error" id="reg-name-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email address <span class="required">*</span></label>
          <div class="form-input-icon-wrap">
            <i class="fas fa-envelope form-input-icon"></i>
            <input
              type="email"
              id="reg-email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>
          <span class="form-error" id="reg-email-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
          <div class="pw-field-wrap">
            <i class="fas fa-lock form-input-icon"></i>
            <input
              type="password"
              id="reg-password"
              name="password"
              class="form-input"
              placeholder="Create a strong password"
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-password" id="toggle-reg-pw" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="strength-bar-container" id="strength-bar-container" style="display:none;">
            <div class="strength-bar-track">
              <div class="strength-bar-fill" id="strength-bar-fill"></div>
            </div>
            <span class="strength-label" id="strength-label"></span>
            <div class="strength-hints">
              <span class="strength-hint" id="hint-length"><i class="fas fa-circle"></i> 8+ characters</span>
              <span class="strength-hint" id="hint-upper"><i class="fas fa-circle"></i> Uppercase</span>
              <span class="strength-hint" id="hint-number"><i class="fas fa-circle"></i> Number</span>
              <span class="strength-hint" id="hint-special"><i class="fas fa-circle"></i> Special char</span>
            </div>
          </div>
          <span class="form-error" id="reg-password-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm password <span class="required">*</span></label>
          <div class="pw-field-wrap">
            <i class="fas fa-lock form-input-icon"></i>
            <input
              type="password"
              id="reg-confirm"
              name="confirmPassword"
              class="form-input"
              placeholder="Repeat your password"
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-password" id="toggle-reg-confirm" aria-label="Toggle confirm password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <span class="form-error" id="reg-confirm-error"></span>
        </div>

        <div class="form-group" style="margin-bottom:8px;">
          <label class="form-check">
            <input type="checkbox" id="reg-terms" name="terms" required>
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
          <span class="form-error" id="reg-terms-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-submit" id="register-btn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>

      </form>

      <div class="auth-divider">or</div>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </div>
  </main>

  <script src="utils.js"></script>
  <script src="cart-manager.js"></script>
  <script src="auth.js"></script>
  <script src="main.js"></script>
</body>
</html>
